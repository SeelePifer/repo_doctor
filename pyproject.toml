[project]
name = "repodoctor"
version = "0.1.0"
description = "Answer repository questions with cited lines, then verify proposed edits in a sandbox."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "typer>=0.12",
  "httpx>=0.27",
  "tomli>=2.0",
  "cursor-sdk>=0.1",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
repodoctor = "repodoctor.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "web", ".git", ".venv"]
